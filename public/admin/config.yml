# Blog editor (Sveltia CMS). Log in at depriver.tech/admin with a GitHub token.
# Posts are saved as Markdown in src/content/blog; each save commits to GitHub and the site redeploys.
backend:
  name: github
  repo: Stark-Priver/depriver-tech
  branch: main

media_folder: public/img/blog
public_folder: /img/blog

site_url: https://depriver.tech
logo_url: /favicon.svg

collections:
  - name: blog
    label: Blog posts
    label_singular: Post
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title]
    summary: "{{title}} · {{date}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Short description, name: description, widget: text, hint: "One or two sentences, shown on cards and in Google." }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { label: Cover image, name: cover, widget: image, required: false }
      - { label: Tags, name: tags, widget: list, default: [] }
      - { label: Draft (hide from site), name: draft, widget: boolean, default: false }
      - { label: Post, name: body, widget: markdown }
