name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # viora (the site's AI assistant on viora cloud) re-reads /llms-full.txt so new posts and story changes reach it
  viora:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Refresh viora's knowledge
        env:
          VIORA_KEY: ${{ secrets.VIORA_KEY }}
        run: |
          if [ -z "$VIORA_KEY" ]; then echo "VIORA_KEY is not set; skipping"; exit 0; fi
          sleep 45
          curl -fsS -X POST "https://viora-cloud.depriver-tech.workers.dev/v1/admin/sites/depriver/reindex" \
            -H "Authorization: Bearer $VIORA_KEY" -H "User-Agent: depriver-deploy"
